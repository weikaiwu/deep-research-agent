<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 技术选型调研助手</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #161a22;
    --panel: #1a1f2b;
    --border: #262c3a;
    --text: #e6e9f0;
    --text-dim: #8b93a5;
    --accent: #4f7cff;
    --accent-2: #8b5cf6;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
  }
  [data-theme="light"] {
    --bg: #f6f7fb;
    --bg-soft: #eef0f6;
    --panel: #ffffff;
    --border: #e2e6ef;
    --text: #1c2230;
    --text-dim: #6b7280;
    --accent: #3b6cf0;
    --accent-2: #7c4df4;
    --ok: #10b981;
    --warn: #d97706;
    --err: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-soft);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px var(--accent);
  }
  .brand small { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 4px; }
  .theme-btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  .theme-btn:hover { border-color: var(--accent); }
  main {
    display: grid; grid-template-columns: 360px 1fr; gap: 18px;
    padding: 18px 22px; max-width: 1280px; margin: 0 auto;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
  .panel h2 {
    font-size: 14px; font-weight: 600; padding: 13px 16px;
    border-bottom: 1px solid var(--border); color: var(--text-dim);
    letter-spacing: .3px;
  }
  .panel-body { padding: 16px; }
  textarea {
    width: 100%; min-height: 120px; resize: vertical;
    background: var(--bg-soft); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; font-size: 14px; font-family: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: none; border-radius: 10px; padding: 10px 18px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost {
    background: var(--bg-soft); color: var(--text); border: 1px solid var(--border);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { color: var(--text-dim); font-size: 12px; margin-top: 12px; }
  #trace { display: flex; flex-direction: column; gap: 10px; }
  .event {
    border: 1px solid var(--border); border-left: 3px solid var(--text-dim);
    border-radius: 10px; padding: 10px 14px; background: var(--bg-soft);
  }
  .event .t { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .event .tag { font-size: 11px; padding: 1px 7px; border-radius: 6px; color: #fff; }
  .event .d { font-size: 12.5px; color: var(--text-dim); margin-top: 6px; word-break: break-all; white-space: pre-wrap; }
  .event.session { border-left-color: var(--text-dim); }
  .event.assistant { border-left-color: var(--accent); }
  .event.assistant .tag { background: var(--accent); }
  .event.assistant-done { border-left-color: var(--accent); opacity: .85; }
  .event.assistant-done .tag { background: var(--accent); }
  .event.tool { border-left-color: var(--accent-2); }
  .event.tool .tag { background: var(--accent-2); }
  .event.tool-done { border-left-color: var(--accent-2); opacity: .85; }
  .event.tool-done .tag { background: var(--accent-2); }
  .event.result { border-left-color: var(--ok); }
  .event.result .tag { background: var(--ok); }
  .event.error { border-left-color: var(--err); }
  .event.error .tag { background: var(--err); }
  .event.info { border-left-color: var(--warn); }
  .event.info .tag { background: var(--warn); }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 40px 0; }
  #fileList { display: flex; flex-direction: column; gap: 8px; }
  .file {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; background: var(--bg-soft);
  }
  .file .name { word-break: break-all; }
  .file a { color: var(--accent); text-decoration: none; font-size: 12px; white-space: nowrap; margin-left: 8px; }
  .file a:hover { text-decoration: underline; }
  .file .size { color: var(--text-dim); font-size: 11px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span>
    AI 技术选型调研助手
    <small>多智能体 · 带引用决策报告</small>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">切换主题</button>
</header>

<main>
  <section class="panel">
    <h2>调研任务</h2>
    <div class="panel-body">
      <textarea id="query" placeholder="例如：对比 LangGraph、CrewAI 和 AutoGen 三个多智能体框架，为我们团队出一份带引用的技术选型报告，覆盖性能、生态、学习成本、社区活跃度等维度。"></textarea>
      <div class="row">
        <button id="btnStart" onclick="startResearch()">开始调研</button>
        <button id="btnNewChat" class="ghost" onclick="newChat()" title="清空当前会话，开启全新调研（重新分配会话ID）">新对话</button>
        <button class="ghost" onclick="document.getElementById('fileInput').click()">上传参考文件</button>
        <input type="file" id="fileInput" multiple style="display:none" onchange="uploadFiles()">
      </div>
      <div class="hint">支持上传 PDF / Word / Markdown / Excel，作为调研参考材料。上传后会自动解析给主智能体。</div>
    </div>
  </section>

  <section class="panel">
    <h2>调度过程（Trace）</h2>
    <div class="panel-body">
      <div id="trace"><div class="empty">发起一个调研任务后，这里会实时显示主智能体的调度过程。</div></div>
    </div>
  </section>

  <section class="panel" style="grid-column: 1 / -1;">
    <h2>生成文件</h2>
    <div class="panel-body">
      <div id="fileList"><div class="empty">暂无生成文件</div></div>
    </div>
  </section>
</main>

<script>
let ws = null;
let currentThread = null;
let sessionDir = null;

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', cur);
  localStorage.setItem('theme', cur);
}
(function initTheme() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
})();

function newThreadId() {
  return 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

// 会话 ID 持久化：同一浏览器窗口内连续调研复用同一 thread_id（断点续跑的前提）
// 点「新对话」才重新分配；刷新页面也保持同一会话
const THREAD_KEY = 'deepagents_thread_id';

function getThreadId() {
  let tid = localStorage.getItem(THREAD_KEY);
  if (!tid) {
    tid = newThreadId();
    localStorage.setItem(THREAD_KEY, tid);
  }
  return tid;
}

function startResearch() {
  const q = document.getElementById('query').value.trim();
  if (!q) { alert('请先输入调研问题'); return; }
  currentThread = getThreadId();   // 复用 localStorage 中的会话，不再每次新建
  sessionDir = null;
  document.getElementById('trace').innerHTML = '';
  document.getElementById('btnStart').disabled = true;
  connectWS(currentThread);
  sendTask(q, currentThread);
}

function newChat() {
  // 显式开启全新会话：清空本地持久化的 thread_id，重新分配
  localStorage.removeItem(THREAD_KEY);
  currentThread = newThreadId();
  localStorage.setItem(THREAD_KEY, currentThread);
  sessionDir = null;
  document.getElementById('trace').innerHTML = '';
  document.getElementById('fileList').innerHTML = '<div class="empty">暂无生成文件</div>';
  addTrace('info', '已开启新对话（重新分配会话ID）', 'thread_id=' + currentThread);
}

function connectWS(threadId) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws/' + threadId);
  ws.onopen = () => addTrace('info', 'WebSocket 已连接', '等待主智能体调度事件…');
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === 'pong') return;
    if (msg.type === 'monitor_event') renderEvent(msg);
  };
  ws.onerror = () => addTrace('error', 'WebSocket 连接出错', '请确认后端服务已启动（api/server.py）。');
  ws.onclose = () => { addTrace('info', 'WebSocket 已断开'); document.getElementById('btnStart').disabled = false; };
}

async function sendTask(query, threadId) {
  try {
    const r = await fetch('/api/task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: query, thread_id: threadId })
    });
    const d = await r.json();
    addTrace('info', '任务已提交', 'thread_id=' + d.thread_id);
  } catch (e) {
    addTrace('error', '提交任务失败', String(e));
    document.getElementById('btnStart').disabled = false;
  }
}

function renderEvent(msg) {
  const { event, message, data } = msg;
  if (event === 'session_created') {
    sessionDir = data && data.path;
    addTrace('session', '工作目录已创建', sessionDir || message);
    if (sessionDir) listFiles(sessionDir);
  } else if (event === 'assistant_call') {
    const name = (data && data.assistant_name) || message;
    const desc = data && data.args && data.args.description;
    addTrace('assistant', '调度子智能体：' + name, desc || '');
  } else if (event === 'tool_start') {
    const name = (data && data.tool_name) || message;
    let detail = '';
    if (data && data.args) {
      try { detail = JSON.stringify(data.args, null, 2); } catch (e) { detail = String(data.args); }
    }
    addTrace('tool', '执行工具：' + name, detail);
  } else if (event === 'tool_end') {
    const name = (data && data.tool_name) || message;
    addTrace('tool-done', '工具完成：' + name, (data && data.summary) || '');
  } else if (event === 'assistant_end') {
    const name = (data && data.assistant_name) || message;
    addTrace('assistant-done', '子智能体完成：' + name, (data && data.summary) || '');
  } else if (event === 'task_result') {
    addTrace('result', '任务完成', (data && data.result) || message);
    document.getElementById('btnStart').disabled = false;
    if (data && data.session_dir) sessionDir = data.session_dir;
    if (sessionDir) listFiles(sessionDir);
    else addTrace('info', '未获取到工作目录，无法自动刷新文件列表');
  } else {
    addTrace('info', message || event);
  }
}

function addTrace(type, title, detail) {
  const box = document.getElementById('trace');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'event ' + type;
  const tagMap = {
    session: '会话', assistant: '调度', 'assistant-done': '完成',
    tool: '工具', 'tool-done': '完成', result: '结果', error: '错误', info: '信息'
  };
  div.innerHTML =
    '<div class="t"><span class="tag">' + (tagMap[type] || type) + '</span>' +
    '<span>' + escapeHtml(title) + '</span></div>' +
    (detail ? '<div class="d">' + escapeHtml(detail) + '</div>' : '');
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function uploadFiles() {
  const input = document.getElementById('fileInput');
  if (!input.files.length) return;
  if (!currentThread) currentThread = newThreadId();
  const fd = new FormData();
  for (const f of input.files) fd.append('files', f);
  fd.append('thread_id', currentThread);
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    const d = await r.json();
    addTrace('info', '文件已上传', (d.files || []).join('、'));
  } catch (e) {
    addTrace('error', '上传失败', String(e));
  }
  input.value = '';
}

async function listFiles(path) {
  try {
    const r = await fetch('/api/files?path=' + encodeURIComponent(path));
    const d = await r.json();
    if (d.error) {
      addTrace('info', '文件列表获取失败: ' + d.error);
      renderFiles([]);
      return;
    }
    renderFiles(d.files || []);
  } catch (e) {
    addTrace('info', '文件列表请求异常: ' + e.message);
    renderFiles([]);
  }
}

function renderFiles(files) {
  const box = document.getElementById('fileList');
  if (!box) return;
  box.innerHTML = '';
  if (!files.length) { box.innerHTML = '<div class="empty">暂无生成文件</div>'; return; }
  files.forEach(f => {
    const div = document.createElement('div');
    div.className = 'file';
    div.innerHTML =
      '<span class="name">' + escapeHtml(f.name) + '</span>' +
      '<span style="display:flex;align-items:center;gap:8px">' +
      '<span class="size">' + formatSize(f.size) + '</span>' +
      '<a href="/api/download?path=' + encodeURIComponent(f.path) + '" target="_blank">下载</a>' +
      '</span>';
    box.appendChild(div);
  });
}

function formatSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}
</script>
</body>
</html>
